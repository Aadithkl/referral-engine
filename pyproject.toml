[project]
name = "referral_engine"
version = "0.1.0"
description = "Adaptive Referral Engine with Valley & Surge Reward System"
authors = [{ name = "Aadith Narayanan" }]
requires-python = ">=3.11"
dependencies = [
    "crewai[tools]>=0.100.0",
    "httpx>=0.27.0",
    "python-dotenv>=1.0.0",
    "pycryptodome>=3.20.0",
    "fastapi>=0.115.0",
    "litellm>=1.84.0",
    "uvicorn[standard]>=0.30.0",
]

[project.scripts]
referral-engine = "referral_engine.main:kickoff"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.crewai]
type = "flow"
