<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>User Search — Referral Engine</title>
<style>
  :root {
    --bg: #0f172a; --surface: #1e293b; --surface2: #111827; --border: #334155;
    --text: #e2e8f0; --muted: #94a3b8; --dim: #64748b;
    --primary: #3b82f6; --active: #60a5fa; --accent: #10b981;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: system-ui, -apple-system, sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; display: flex; flex-direction: column; align-items: center; padding: 40px 16px; }
  .container { width: 100%; max-width: 720px; }
  h1 { font-size: 24px; font-weight: 700; margin-bottom: 4px; }
  .sub { font-size: 13px; color: var(--dim); margin-bottom: 24px; }

  .search-wrap { display: flex; gap: 6px; margin-bottom: 24px; }
  .search-wrap input {
    flex: 1; background: var(--surface); color: var(--text); border: 1px solid var(--border);
    border-radius: 8px; padding: 10px 14px; font-size: 14px; outline: none;
    transition: border-color 0.15s;
  }
  .search-wrap input:focus { border-color: var(--primary); }
  .search-wrap input::placeholder { color: var(--dim); }
  .search-wrap button {
    background: var(--primary); color: #fff; border: none; border-radius: 8px;
    padding: 10px 20px; font-size: 13px; font-weight: 600; cursor: pointer;
    transition: filter 0.15s; white-space: nowrap;
  }
  .search-wrap button:hover { filter: brightness(1.15); }

  .quick-links { margin-bottom: 24px; display: flex; gap: 8px; flex-wrap: wrap; }
  .quick-links span { font-size: 11px; color: var(--dim); padding: 5px 0; }
  .quick-link {
    padding: 5px 12px; border: 1px solid var(--border); border-radius: 16px;
    font-size: 11px; color: var(--muted); text-decoration: none; cursor: pointer;
    transition: all 0.15s;
  }
  .quick-link:hover { border-color: var(--primary); color: var(--text); background: rgba(59,130,246,0.08); }

  .results { display: none; }
  .results.visible { display: block; }

  .user-card {
    background: var(--surface); border: 1px solid var(--border); border-radius: 10px;
    padding: 16px; margin-bottom: 10px; transition: border-color 0.15s;
    display: flex; justify-content: space-between; align-items: center;
  }
  .user-card:hover { border-color: var(--primary); }
  .user-card .uid { font-size: 14px; font-weight: 600; color: var(--text); }
  .user-card .meta { font-size: 11px; color: var(--dim); margin-top: 4px; display: flex; gap: 12px; }
  .user-card .meta span { display: flex; align-items: center; gap: 3px; }
  .user-card .archetype { display: inline-block; padding: 2px 8px; border-radius: 10px; font-size: 10px; font-weight: 600; }
  .arc-Influencer { background: rgba(239,68,68,0.12); color: #ef4444; }
  .arc-Broadcaster { background: rgba(245,158,11,0.12); color: #f59e0b; }
  .arc-Fan { background: rgba(59,130,246,0.12); color: #60a5fa; }
  .arc-Newcomer { background: rgba(16,185,129,0.12); color: #10b981; }
  .user-card .view-btn {
    background: transparent; border: 1px solid var(--border); color: var(--muted);
    padding: 6px 14px; border-radius: 6px; font-size: 11px; cursor: pointer; text-decoration: none;
    transition: all 0.15s;
  }
  .user-card .view-btn:hover { border-color: var(--primary); color: var(--text); }

  .no-results { text-align: center; padding: 40px; color: var(--dim); font-size: 13px; }
  .loading { text-align: center; padding: 40px; color: var(--dim); }
  .spinner { display: inline-block; width: 20px; height: 20px; border: 2px solid var(--border); border-top-color: var(--primary); border-radius: 50%; animation: spin 0.8s linear infinite; margin-bottom: 8px; }
  @keyframes spin { to { transform: rotate(360deg); } }

  .nav-back { margin-top: 32px; text-align: center; }
  .nav-back a { color: var(--dim); font-size: 12px; text-decoration: none; padding: 6px 14px; border: 1px solid var(--border); border-radius: 6px; transition: all 0.15s; }
  .nav-back a:hover { border-color: var(--primary); color: var(--text); }
</style>
</head>
<body>
<div class="container">
  <h1>User Search</h1>
  <p class="sub">Find users and view their reward progress</p>

  <div class="search-wrap">
    <input type="text" id="searchInput" placeholder="Search by user ID..." autofocus>
    <button id="searchBtn">Search</button>
  </div>

  <div class="quick-links">
    <span>Jump to:</span>
    <a class="quick-link" data-user="user_123">user_123</a>
    <a class="quick-link" data-user="user_456">user_456</a>
    <a class="quick-link" data-user="" style="border-style:dashed">Show all users</a>
  </div>

  <div id="results" class="results"></div>
</div>

<div class="nav-back">
  <a href="/dashboard">Dashboard</a>
  <a href="/overview">Overview</a>
</div>

<script>
const input = document.getElementById('searchInput');
const btn = document.getElementById('searchBtn');
const results = document.getElementById('results');

async function search(query) {
  results.className = 'results visible';
  results.innerHTML = '<div class="loading"><div class="spinner"></div><div>Searching…</div></div>';

  try {
    const url = query
      ? '/api/user/progress?search=' + encodeURIComponent(query)
      : '/api/user/progress';
    const res = await fetch(url);
    if (!res.ok) throw new Error('Search failed');
    const data = await res.json();
    render(data);
  } catch (e) {
    results.innerHTML = '<div class="no-results">Error searching. Try again.</div>';
  }
}

function render(users) {
  if (!users || users.length === 0) {
    results.innerHTML = '<div class="no-results">No users found matching your search.</div>';
    return;
  }

  const labels = { Influencer: 'Top Referrer', Broadcaster: 'Rising Star', Fan: 'Loyal User', Newcomer: 'Getting Started' };
  const items = users.slice(0, 50).map(u => {
    const tier = u.archetype || 'Unknown';
    const label = labels[tier] || tier;
    const cls = 'arc-' + tier;
    return `
      <div class="user-card">
        <div>
          <div class="uid">${esc(u.user_id)}</div>
          <div class="meta">
            <span class="archetype ${cls}">${esc(label)}</span>
            <span>${u.referrals_completed || 0} / ${u.referrals_target || 0} referrals</span>
            <span>${Number(u.total_earned || 0).toFixed(0)} credits</span>
          </div>
        </div>
        <a class="view-btn" href="/user/${esc(u.user_id)}">View &rarr;</a>
      </div>`;
  }).join('');
  results.innerHTML = items;
}

function esc(s) { return String(s||'').replace(/[<>&]/g,''); }

btn.addEventListener('click', () => search(input.value.trim()));
input.addEventListener('keydown', e => { if (e.key === 'Enter') search(input.value.trim()); });

document.querySelectorAll('.quick-link').forEach(el => {
  el.addEventListener('click', e => {
    e.preventDefault();
    const user = el.dataset.user;
    input.value = user;
    search(user);
  });
});

// Load all on page load
search('');
</script>
</body>
</html>
