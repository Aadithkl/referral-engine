<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Overview — Referral Engine</title>
<style>
  :root {
    --bg: #0a0f1e; --surface: #131a2e; --surface2: #0f1525; --border: #1e2d4a;
    --text: #e8edf5; --muted: #8899b9; --dim: #556688;
    --primary: #3b82f6; --accent: #10b981; --danger: #ef4444;
    --inf: #3b82f6; --bdc: #f59e0b; --fan: #10b981; --new: #8b5cf6;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: system-ui, -apple-system, sans-serif;
    background: var(--bg); color: var(--text);
    min-height: 100vh; padding: 24px;
  }
  .container { max-width: 1200px; margin: 0 auto; }
  header {
    display: flex; align-items: center; justify-content: space-between;
    margin-bottom: 24px; flex-wrap: wrap; gap: 12px;
  }
  header h1 { font-size: 24px; font-weight: 700; color: var(--text); }
  header .nav { display: flex; gap: 8px; }
  header .nav a {
    padding: 6px 16px; border-radius: 6px; font-size: 12px; font-weight: 600;
    text-decoration: none; border: 1px solid var(--border); color: var(--muted);
    transition: all 0.15s;
  }
  header .nav a:hover { border-color: var(--primary); color: var(--text); }
  header .nav a.active { background: var(--primary); border-color: var(--primary); color: #fff; }

  .stat-cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 12px; margin-bottom: 24px; }
  .stat-card {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 10px; padding: 18px 16px; text-align: center;
  }
  .stat-card .num {
    font-size: 32px; font-weight: 800; color: var(--text);
    letter-spacing: -0.01em; line-height: 1.1;
  }
  .stat-card .lbl {
    font-size: 11px; color: var(--dim); margin-top: 4px;
    text-transform: uppercase; letter-spacing: 0.05em;
  }
  .stat-card .sub {
    font-size: 10px; color: var(--muted); margin-top: 2px;
  }

  .main-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-bottom: 24px; }
  @media (max-width: 800px) { .main-grid { grid-template-columns: 1fr; } }

  .panel {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 10px; padding: 18px;
  }
  .panel h3 {
    font-size: 12px; color: var(--dim); text-transform: uppercase;
    letter-spacing: 0.05em; margin-bottom: 14px;
  }

  .arch-bar { margin-bottom: 8px; }
  .arch-bar .arch-row { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; }
  .arch-bar .arch-name { font-size: 11px; width: 80px; color: var(--muted); flex-shrink: 0; }
  .arch-bar .arch-track { flex: 1; height: 8px; background: var(--surface2); border-radius: 4px; overflow: hidden; }
  .arch-bar .arch-fill { height: 100%; border-radius: 4px; transition: width 0.5s; }
  .arch-bar .arch-num { font-size: 11px; color: var(--dim); width: 30px; text-align: right; flex-shrink: 0; }

  .feed-item {
    padding: 6px 0; border-bottom: 1px solid var(--border);
    font-size: 11px; display: flex; justify-content: space-between; align-items: center;
  }
  .feed-item .feed-user { color: var(--primary); font-weight: 600; }
  .feed-item .feed-count { color: var(--accent); }
  .feed-item .feed-ts { color: var(--dim); font-size: 10px; }

  .user-table { width: 100%; border-collapse: collapse; font-size: 11px; margin-top: 8px; }
  .user-table th {
    text-align: left; padding: 8px 10px; color: var(--dim); border-bottom: 2px solid var(--border);
    font-size: 9px; text-transform: uppercase; letter-spacing: 0.04em; font-weight: 600;
  }
  .user-table td {
    padding: 7px 10px; border-bottom: 1px solid var(--border); color: var(--muted);
  }
  .user-table .uid { color: var(--primary); font-variant-numeric: tabular-nums; }
  .user-table .rnum { color: var(--text); font-weight: 600; font-variant-numeric: tabular-nums; }
  .user-table .earn { color: var(--accent); font-variant-numeric: tabular-nums; }
  .user-table tbody tr:hover { background: rgba(59,130,246,0.04); }

  .refresh-bar { text-align: right; margin-bottom: 12px; }
  .refresh-bar button {
    background: var(--primary); color: #fff; border: none; padding: 6px 16px;
    border-radius: 6px; font-size: 11px; font-weight: 600; cursor: pointer;
  }
  .loading { text-align: center; padding: 60px; color: var(--dim); font-size: 13px; }
  .empty { text-align: center; padding: 30px; color: var(--dim); font-size: 12px; }
</style>
</head>
<body>
<div class="container">

<header>
  <h1>Referral Engine</h1>
  <div class="nav">
    <a href="/overview" class="active">Overview</a>
    <a href="/dashboard">Curve Designer</a>
  </div>
</header>

<div id="app"><div class="loading">Loading overview…</div></div>

</div>

<script>
async function load() {
  try {
    const r = await fetch('/api/overview');
    const data = await r.json();
    render(data);
  } catch(e) {
    document.getElementById('app').innerHTML = '<div class="loading">Failed to load: ' + esc(e.message) + '</div>';
  }
}

function render(data) {
  const s = data.stats;
  const users = data.users || [];
  const recent = data.recent_confirmations || [];
  const dist = s.archetype_distribution || [];
  const totalUsers = s.total_users || 0;
  const maxArch = Math.max(1, ...dist.map(d => d.n));

  const archColors = { Influencer: 'var(--inf)', Broadcaster: 'var(--bdc)', Fan: 'var(--fan)', Newcomer: 'var(--new)' };

  document.getElementById('app').innerHTML = `
    <div class="stat-cards">
      <div class="stat-card">
        <div class="num">${s.total_users || 0}</div>
        <div class="lbl">Users Registered</div>
        <div class="sub">${s.active_users || 0} active</div>
      </div>
      <div class="stat-card">
        <div class="num">${s.total_referrals_completed || 0}</div>
        <div class="lbl">Referrals Completed</div>
        <div class="sub">${s.total_confirmations || 0} confirm events</div>
      </div>
      <div class="stat-card">
        <div class="num">${Number(s.total_credits_earned || 0).toFixed(0)}</div>
        <div class="lbl">Credits Earned</div>
        <div class="sub">across all users</div>
      </div>
      <div class="stat-card">
        <div class="num">${s.total_users_tracked || 0}</div>
        <div class="lbl">Users Tracked</div>
        <div class="sub">with progress data</div>
      </div>
    </div>

    <div class="refresh-bar"><button onclick="load()">Refresh</button></div>

    <div class="main-grid">
      <div class="panel">
        <h3>Archetype Distribution</h3>
        <div class="arch-bar">
          ${dist.length ? dist.map(d => `
            <div class="arch-row">
              <span class="arch-name" style="color:${archColors[d.archetype] || 'var(--dim)'}">${esc(d.archetype)}</span>
              <div class="arch-track"><div class="arch-fill" style="width:${(d.n/maxArch)*100}%;background:${archColors[d.archetype] || 'var(--dim)'}"></div></div>
              <span class="arch-num">${d.n}</span>
            </div>
          `).join('') : '<div class="empty">No data</div>'}
        </div>
      </div>

      <div class="panel">
        <h3>Recent Activity</h3>
        ${recent.length ? recent.map(r => `
          <div class="feed-item">
            <span><span class="feed-user">${esc(r.user_id)}</span></span>
            <span class="feed-count">+${r.count}</span>
            <span class="feed-ts">${(r.timestamp||'').slice(0,16)}</span>
          </div>
        `).join('') : '<div class="empty">No confirmations yet</div>'}
      </div>
    </div>

    <div class="panel">
      <h3>All Users (${users.length})</h3>
      ${users.length ? `
        <table class="user-table">
          <thead><tr>
            <th>User ID</th><th>Label</th><th>Type</th><th>Referrals</th><th>Earned</th><th>Penalty</th><th>Status</th><th>Updated</th>
          </tr></thead>
          <tbody>
            ${users.map(p => `
              <tr>
                <td class="uid" title="${esc(p.user_id)}">${esc(p.user_id)}</td>
                <td>${esc(p.friendly_label)}</td>
                <td style="color:${archColors[p.archetype] || 'var(--dim)'}">${esc(p.archetype)}</td>
                <td class="rnum">${p.referrals_completed}/${p.referrals_target}</td>
                <td class="earn">${Number(p.total_earned).toFixed(0)}</td>
                <td style="font-size:10px">${(p.penalty_factor*100).toFixed(0)}%</td>
                <td style="color:${p.status==='active'?'var(--accent)':'var(--danger)'}">${esc(p.status)}</td>
                <td style="font-size:10px;color:var(--dim)">${(p.updated_at||'').slice(0,10)}</td>
              </tr>
            `).join('')}
          </tbody>
        </table>
      ` : '<div class="empty">No users tracked yet. Run a pipeline to add users.</div>'}
    </div>
  `;
}

function esc(s) { return String(s||'').replace(/[<>&]/g,''); }
load();
</script>
</body>
</html>
